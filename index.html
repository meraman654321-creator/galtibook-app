<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#f3f2ee;--glow:rgba(79,60,240,.10);--card:#ffffff;--card2:#f9f8f5;--fg:#15141c;--muted:#6b6878;--faint:#a3a0b0;
 --line:rgba(21,20,28,.08);--accent:#4f3cf0;--accent2:#8b7bff;--on-accent:#ffffff;
 --good:#15803d;--warn:#b45309;--bad:#dc2626;--chip:rgba(79,60,240,.09);
 --glass:rgba(255,255,255,.82);
 --sh:0 1px 1px rgba(21,20,28,.04),0 10px 26px -14px rgba(21,20,28,.16);
 --sh-lg:0 2px 4px rgba(21,20,28,.05),0 26px 50px -20px rgba(79,60,240,.35);
 --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
 --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a10;--glow:rgba(139,123,255,.16);--card:#14141d;--card2:#1a1a25;--fg:#f1f0f7;--muted:#9d9ab2;--faint:#6b6880;--line:rgba(255,255,255,.07);--accent:#8b7bff;--accent2:#b8adff;--on-accent:#0b0a1a;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:rgba(139,123,255,.14);--glass:rgba(20,20,29,.80);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 14px 30px -16px rgba(0,0,0,.6);--sh-lg:0 0 0 1px rgba(255,255,255,.05),0 28px 56px -20px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a10;--glow:rgba(139,123,255,.16);--card:#14141d;--card2:#1a1a25;--fg:#f1f0f7;--muted:#9d9ab2;--faint:#6b6880;--line:rgba(255,255,255,.07);--accent:#8b7bff;--accent2:#b8adff;--on-accent:#0b0a1a;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--chip:rgba(139,123,255,.14);--glass:rgba(20,20,29,.80);--sh:0 1px 0 rgba(255,255,255,.03) inset,0 14px 30px -16px rgba(0,0,0,.6);--sh-lg:0 0 0 1px rgba(255,255,255,.05),0 28px 56px -20px rgba(0,0,0,.75);color-scheme:dark}

html,body{height:100%}
body{margin:0;overflow-x:hidden;color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));background:radial-gradient(900px 480px at 88% -10%,var(--glow),transparent 62%),radial-gradient(700px 420px at -12% 35%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed}

h1{font:400 36px/1.02 var(--serif);letter-spacing:-.01em;margin:4px 0 0}
h2{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:26px 4px 2px}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 2px 6px;min-width:0}
.top small{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.top small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--chip)}
.top h1{overflow-wrap:anywhere}
#gear{min-height:40px;padding:0 16px;flex:none}

main{flex:1;min-height:0;overflow-y:auto;padding-bottom:132px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
main>section{display:flex;flex-direction:column;gap:14px;min-width:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.row>span:first-child,.row>b{overflow-wrap:anywhere;min-width:0}
.head b{font:600 17px/1.2 var(--sans)}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{background:var(--chip);color:var(--accent);border-radius:999px;padding:4px 11px;font:600 12.5px/1.3 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}

.btn{font:600 15px/1 var(--sans);letter-spacing:.005em;border:0;border-radius:999px;padding:0 22px;min-height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);cursor:pointer;box-shadow:0 12px 24px -14px var(--accent);transition:transform .15s ease,box-shadow .2s ease,opacity .2s;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.small{min-height:38px;padding:0 15px;font-size:14px;box-shadow:none}
.btn.wide{width:100%;font-size:16px}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 0;min-width:0}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input,select,textarea{font:500 15px/1.4 var(--sans);color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;min-width:0}
textarea{resize:vertical}
label{display:flex;flex-direction:column;gap:8px;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
label input,label select{font:500 15px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--fg)}

.bigbtn{display:flex;align-items:center;justify-content:center;min-height:138px;padding:18px;border-radius:24px;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:var(--sh);color:var(--fg);font:600 17px/1.2 var(--sans);letter-spacing:0;text-transform:none;cursor:pointer;text-align:center;transition:transform .15s ease}
.bigbtn:active{transform:scale(.98)}
.bigbtn::before{content:"";width:46px;height:46px;border-radius:16px;background:var(--chip);margin-bottom:12px;flex:none}
.bigbtn.sm{min-height:50px;border-radius:999px;font-size:15px;flex-direction:row;gap:8px}
.bigbtn.sm::before{display:none}

.exams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exam{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px 16px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--fg);box-shadow:var(--sh);font:inherit;cursor:pointer;min-width:0;transition:transform .15s ease}
.exam:active{transform:scale(.98)}
.exam b{font:400 28px/1 var(--serif)}
.exam span{font-size:12px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;z-index:20;background:radial-gradient(900px 480px at 88% -10%,var(--glow),transparent 62%),var(--bg);overflow-y:auto;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
.ob{display:flex;flex-direction:column;gap:16px;padding-block:22px}
.ob h1{font-size:42px}
.brand{font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}

nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:28px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);box-shadow:var(--sh-lg)}
nav button{font:600 11.5px/1 var(--sans);letter-spacing:.02em;background:transparent;border:0;color:var(--muted);padding:9px 0 8px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:58px;cursor:pointer;position:relative;transition:color .2s,background .25s;touch-action:manipulation}
nav button.on{color:var(--accent);background:var(--chip)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .badge{position:absolute;top:7px;left:calc(50% + 6px);margin:0;min-width:18px;text-align:center;font:700 10.5px/1 var(--sans);padding:3px 5px;border-radius:999px}
.badge{background:var(--bad);color:#fff}

.cropwrap{display:flex;justify-content:center;background:#07070b;border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
#crop{display:block;max-width:100%;height:auto;touch-action:none}
.qprev{width:100%;max-height:280px;object-fit:contain;border-radius:22px;background:var(--card2);border:1px solid var(--line);box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-direction:row;align-items:center;gap:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 15px;color:var(--fg);font:500 14px/1.2 var(--sans);letter-spacing:0;text-transform:none;cursor:pointer;min-width:0;transition:background .2s,color .2s}
.chip input{width:auto;padding:0;margin:0 7px 0 0;accent-color:var(--accent)}
.chip:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;box-shadow:0 10px 20px -12px var(--accent)}
.lbl{margin:8px 4px 0;font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:stretch}
.inline input{flex:1}
.bk{min-height:120px;font:12px/1.5 ui-monospace,Menlo,monospace;border-radius:16px}

.prog{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.flash{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:14px;user-select:none;min-width:0;box-shadow:var(--sh)}
.flash img{display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:18px;background:var(--card2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tags .pill{white-space:normal;overflow-wrap:anywhere}
.reveal{width:100%;min-height:54px;border-radius:999px;border:1px dashed var(--accent);background:var(--chip);color:var(--accent);font:600 15px/1 var(--sans);cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.empty{align-items:center;text-align:center;padding:36px 22px}
.empty h2{font:400 32px/1.1 var(--serif);text-transform:none;letter-spacing:0;color:var(--fg);margin:0}

#dueBtn{min-height:76px;justify-content:space-between;text-align:left;padding:0 24px;border-radius:26px;font:600 17px/1.2 var(--sans);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 22px 40px -22px var(--accent)}
#dueBtn::after{content:"\2192";font:400 26px/1 var(--serif);margin-left:12px}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh);min-width:0;display:flex;flex-direction:column;gap:8px}
.kpi b{display:block;font:400 40px/1 var(--serif);font-variant-numeric:tabular-nums}
.kpi span{font:600 11px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-width:0}
.bar:last-child{margin-bottom:0}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font:500 14px/1.3 var(--sans)}
.bar .bl span{overflow-wrap:anywhere;min-width:0}
.bar b{font-variant-numeric:tabular-nums;color:var(--accent)}
.track{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;box-shadow:0 0 14px -2px var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}

.rrow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;min-width:0;box-shadow:var(--sh)}
.rrow img{width:60px;height:60px;object-fit:cover;border-radius:14px;flex:none;background:var(--card2)}
.rrow div{min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow b{font:600 14.5px/1.3 var(--sans);overflow-wrap:anywhere}
.rrow span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font:500 14px/1.3 var(--sans);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1);z-index:30;max-width:calc(100% - 40px);text-align:center;box-shadow:var(--sh-lg)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
